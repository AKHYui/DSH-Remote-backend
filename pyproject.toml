[project]
name = "dsh-remote-bridge-backend"
version = "0.1.0"
description = "FastAPI relay between the DSH desktop plugin and mobile clients"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "websockets>=12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]
